[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cielo-stone-intelligence"
version = "0.3.0"
description = "RAG semântico com embeddings e MLP sobre a documentação pública da Cielo"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
full = ["sentence-transformers>=3.0", "streamlit>=1.35", "pymupdf>=1.24"]

[project.scripts]
csi = "csi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
